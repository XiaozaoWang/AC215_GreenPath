# 模型服务要装的 Python 包；具体版本由 `uv lock` 锁进 uv.lock，build 镜像时按 uv.lock 原样安装
# 改了这里要重新运行一次 `uv lock`
[project]
name = "greenpath-model-service"
version = "0.1.0"
description = "GreenPath model service: H3 cells (or one aerial tile) in, 15 scenery scores out"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",           # 网页接口
    "uvicorn>=0.30,<1",            # 运行 FastAPI 的服务器
    "python-multipart>=0.0.9",     # /predict_image 接收上传的图片
    "torch>=2.14,<2.15",           # 和训练时同一个大版本（config.json 里记着 torch 2.14.1），CPU 版，见下面
    "torchvision>=0.29,<0.30",     # timm 要用
    "timm==1.0.31",                # 和训练时完全一样，DINOv2 和预处理才一致
    "pillow>=11",                  # 读图片
    "gcsfs>=2025.1,<2027",         # 读 bucket：格子索引和航拍图
    "pandas>=2.2,<3",
    "pyarrow>=19,<24",             # 读 Parquet
]

[tool.uv]
# 只在 Docker 里（Linux）安装，不在 Mac 上直接装
environments = ["sys_platform == 'linux'"]

# torch 用 CPU 版：Cloud Run 上没有 GPU，CPU 版比默认的 CUDA 版小几个 GB，镜像小、启动快
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
