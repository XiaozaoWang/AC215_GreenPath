# 两个容器：
#   vector-db-cli：跑 cli.py（切块、转向量、写库、检索）
#   chromadb：向量库服务器，数据存在本地 docker-volumes/chromadb，容器删了数据还在
# 两个容器在同一个网络里，cli 用容器名 greenpath-chromadb 就能找到数据库
networks:
    default:
        name: greenpath-vector-db-network

services:
    vector-db-cli:
        image: greenpath-vector-db-cli
        build: .
        container_name: greenpath-vector-db-cli
        volumes:
            - ${HOME}/secrets:/secrets:ro   # 服务账号 key 只读挂进来，不进镜像、不进 git
            - .:/app                        # 代码目录：改了 cli.py 不用重新 build，outputs/ 直接出现在本地
        environment:
            GOOGLE_APPLICATION_CREDENTIALS: /secrets/llm-service-account.json
            GCP_PROJECT: $GCP_PROJECT
            CHROMADB_HOST: greenpath-chromadb
        depends_on:
            - chromadb
    chromadb:
        image: chromadb/chroma:1.5.9          # 和 uv.lock 里的 chromadb 客户端同一个版本
        container_name: greenpath-chromadb
        ports:
            - 8000:8000                     # Mac 的 8000 端口 → 容器的 8000 端口（本地也能用浏览器/脚本连）
        volumes:
            - ./docker-volumes/chromadb:/data
