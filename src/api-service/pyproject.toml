[project]
name = "api-service"
version = "0.1.0"
description = "SmartPath API service: preference parsing (Gemini) + tile scoring"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "google-auth>=2.40.0",
    "google-cloud-storage>=3.0.0",
    "h3>=4.2.0",
    "httpx>=0.28.1",
    "pyarrow>=19.0.0",
    "requests>=2.32.0",
    "google-genai>=2.30.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
