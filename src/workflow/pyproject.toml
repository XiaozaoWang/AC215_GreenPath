# 这个容器要装的 Python 包：只用来定义、编译、提交流程，不处理数据
# 具体版本由 `uv lock` 锁进 uv.lock；改了这里要重新运行一次 `uv lock`
[project]
name = "greenpath-workflow"
version = "0.1.0"
description = "GreenPath Vertex AI pipeline: data-collector -> data-labeler -> data-processor -> model-training"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-aiplatform>=1.120.0",   # 提交流程到 Vertex AI
    "kfp>=2.14.6",                        # 定义步骤和流程，编译成 yaml
]
