# 这个容器要装的 Python 包（相当于购物清单）
# 具体版本由 `uv lock` 锁进 uv.lock；build 镜像时按 uv.lock 原样安装，所以你、同学、Vertex 上的环境完全一样
# 改了这里要重新运行一次 `uv lock`
[project]
name = "greenpath-data-collector"
version = "0.1.0"
description = "GreenPath data collector: H3 cells, NAIP aerial tiles, Mapillary street view, OSM + WorldCover features"
requires-python = ">=3.12"
dependencies = [
    "fsspec>=2026.9.0",
    "gcsfs>=2026.10.1",                    # 读写 bucket
    "google-auth>=2.62.0",                 # 自动找到当前身份（本地是你的账号，云上是服务账号）
    "google-cloud-secret-manager>=2.24.0", # 云上从 Secret Manager 取 Mapillary token
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "h3>=4.5.0",
    "rasterio>=1.4.4",
    "pyproj>=3.7.2",
    "shapely>=2.2.0",
    "geopandas>=1.2.0",
    "pyrosm>=0.24.0",
    "pystac-client>=0.9.1",
    "planetary-computer>=1.0.0",
    "requests>=2.34.2",
    "mapbox-vector-tile>=2.2.0",
    "mercantile>=1.2.1",
    "pillow>=13.0.0",
    "matplotlib>=3.11.2",
    "folium>=0.20.0",
    "tqdm>=4.70.1",
]
