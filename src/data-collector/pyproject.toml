# Python packages this container needs (like a shopping list)
# Exact versions are locked into uv.lock by `uv lock`; the image build installs exactly what uv.lock says, so you, teammates and Vertex all get the same env
# After changing this, run `uv lock` again
[project]
name = "greenpath-data-collector"
version = "0.1.0"
description = "GreenPath data collector: H3 cells, NAIP aerial tiles, Mapillary street view, OSM + WorldCover features"
requires-python = ">=3.12"
dependencies = [
    "fsspec>=2026.9.0",
    "gcsfs>=2026.10.1",                    # read/write the bucket
    "google-auth>=2.62.0",                 # finds the current identity automatically (locally your account, in the cloud the service account)
    "google-cloud-secret-manager>=2.24.0", # in the cloud, gets the Mapillary token from Secret Manager
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "h3>=4.5.0",
    "rasterio>=1.4.4",
    "pyproj>=3.7.2",
    "shapely>=2.2.0",
    "geopandas>=1.2.0",
    "pyrosm>=0.24.0",
    "pystac-client>=0.9.1",
    "planetary-computer>=1.0.0",
    "requests>=2.34.2",
    "mapbox-vector-tile>=2.2.0",
    "mercantile>=1.2.1",
    "pillow>=13.0.0",
    "matplotlib>=3.11.2",
    "folium>=0.20.0",
    "tqdm>=4.70.1",
]
