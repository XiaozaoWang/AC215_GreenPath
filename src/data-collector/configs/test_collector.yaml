# Dataset definition: changing the params below means a different dataset (needs a new dataset_id); areas can only be added at the end, existing bboxes can't change
dataset_id: Yue_20261108_test_collector   # for test runs; only used when --dataset is not given on the command line (the workflow passes DATASET)

h3_res: 10                  # cell size: about 130 m
min_year: 2019              # only street photos from this year on
exclude_months: [12, 1, 2, 3]   # no leaves in winter, skip
min_images_per_cell: 2      # min street photos per cell
max_images_per_cell: 4      # max photos kept (different headings)
tile_px: 256                # aerial tile side length (pixels)
ground_m: 154               # ground width covered by the aerial tile and map features (m)
naip_min_year: 2018
worldcover_year: 2021
selection: mmr_v2           # version of the street photo selection rules (record only)
osm_snapshot: nearest_to_naip   # which OSM year to use (record only)

# bbox = [min lon, min lat, max lon, max lat]; order matters: when two bboxes overlap, a cell goes to the earlier one (cities first)
areas:
  - {area_id: city_wa_laconner_edge,     area_type: city,   area_subtype: edge,       bbox: [-122.513952, 48.379994, -122.490778, 48.399463]}
