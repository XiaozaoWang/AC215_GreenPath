# 数据集定义：改了下面的参数就等于换了一个数据集（要换 dataset_id）；areas 只能往后加，已有的 bbox 不能改
dataset_id: 1026_Full_data   # 只在命令行没给 --dataset 时用（workflow 会传 DATASET）

h3_res: 10                  # 格子大小：约 130 m
min_year: 2019              # 只要这一年以后的街景
exclude_months: [12, 1, 2, 3]   # 冬天没树叶，不要
min_images_per_cell: 2      # 一个格子至少几张街景
max_images_per_cell: 4      # 最多留几张（方向不同）
tile_px: 256                # 航拍图边长（像素）
ground_m: 154               # 航拍图和地图特征覆盖的地面宽度（米）
naip_min_year: 2018
worldcover_year: 2021
selection: mmr_v2           # 选街景的规则版本（只做记录）
osm_snapshot: nearest_to_naip   # OSM 用哪一年（只做记录）

# bbox = [最小经度, 最小纬度, 最大经度, 最大纬度]；顺序有用：两个 bbox 重叠时，格子归排在前面的那个（城市优先）
areas:
