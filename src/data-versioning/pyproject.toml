# Python packages this container needs; exact versions are locked into uv.lock by `uv lock`, and the image build installs exactly what's in uv.lock
# If you change this, run `uv lock` again
[project]
name = "greenpath-data-versioning"
version = "0.1.0"
description = "GreenPath data versioning: snapshot a training set (table + aerial tiles) with DVC"
requires-python = ">=3.12,<3.15"
dependencies = [
    "dvc>=3.60,<4",           # data versioning
    "dvc-gs>=3.0,<4",         # lets DVC push data to gs:// (dvc_store)
    "gcsfs>=2025.1,<2027",    # cli.py downloads files from the bucket
    "pandas>=2.2,<3",         # reads the training table to get tile_path
    "pyarrow>=19,<24",        # reads Parquet
]
