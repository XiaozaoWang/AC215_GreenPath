# 这个容器要装的 Python 包；具体版本由 `uv lock` 锁进 uv.lock，build 镜像时按 uv.lock 原样安装
# 改了这里要重新运行一次 `uv lock`
[project]
name = "greenpath-data-versioning"
version = "0.1.0"
description = "GreenPath data versioning: snapshot a training set (table + aerial tiles) with DVC"
requires-python = ">=3.12,<3.15"
dependencies = [
    "dvc>=3.60,<4",           # 数据版本管理
    "dvc-gs>=3.0,<4",         # 让 DVC 能把数据推到 gs://（dvc_store）
    "gcsfs>=2025.1,<2027",    # cli.py 从 bucket 下载文件
    "pandas>=2.2,<3",         # 读训练表，拿 tile_path
    "pyarrow>=19,<24",        # 读 Parquet
]
