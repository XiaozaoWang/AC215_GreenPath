[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "greenpath-source"
version = "0.1.0"
description = "Standalone commands extracted from GreenPath notebooks 01-04"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
greenpath-source = "greenpath_source.cli:main"

[tool.setuptools.packages.find]
include = ["greenpath_source*"]

[tool.setuptools.package-data]
greenpath_source = ["notebook-provenance.json"]
