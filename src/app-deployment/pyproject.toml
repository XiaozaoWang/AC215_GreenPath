# Local deployment dependencies; uv.lock pins the versions used in the tool container.
[project]
name = "greenpath-app-deployment"
version = "0.1.0"
description = "GreenPath app deployment: deploy and test API Service and Frontend"
requires-python = ">=3.12,<3.15"
dependencies = [
    "google-cloud-run>=0.10,<1",   # Create/update Cloud Run services and service-level IAM.
    "google-auth>=2.40.0",
    "requests>=2.32,<3",           # Optional live smoke tests.
]

[dependency-groups]
dev = ["pytest>=9.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
