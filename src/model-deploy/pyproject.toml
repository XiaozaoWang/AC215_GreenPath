[project]
name = "greenpath-model"
version = "0.1.0"
description = "Portable, validated GreenPath regression artifacts and batch inference"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==2.4.6", "pandas==3.0.6", "pyarrow==26.0.0"]

[project.scripts]
greenpath-predict = "greenpath_model.predict:main"
greenpath-infer = "greenpath_model.region:main"

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["greenpath_model*"]

[dependency-groups]
dev = ["pytest>=9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
