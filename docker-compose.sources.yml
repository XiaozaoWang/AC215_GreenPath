# One upstream image/service: all runs 01-04 sequentially in one container.
# Individual commands remain available for diagnosis and bounded labeling.
services:
  data-source:
    image: greenpath-data-source:ml
    build:
      context: .
      dockerfile: src/data-source/Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ${SOURCE_DATA_DIR:-./.artifacts/sources/boston-source-local-v1}:/data
      - type: bind
        source: ${SOURCE_CONFIG:-./configs/source-boston.example.json}
        target: /config/source.json
        read_only: true
        bind:
          create_host_path: false
    init: true
    environment:
      MPLCONFIGDIR: /tmp/matplotlib
      MAPILLARY_TOKEN: ${MAPILLARY_TOKEN:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
    # No new paid labels without explicit all --allow-labeling --max-images N.
    command: ["all", "--config", "/config/source.json", "--data-root", "/data", "--max-images", "0"]
    mem_limit: 4g
