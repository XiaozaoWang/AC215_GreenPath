[project]
name = "api-service"
version = "0.1.0"
description = "SmartPath API service: preference parsing (Gemini) + tile scoring"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "google-genai>=2.30.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=9.1.1",
]

# pytest: find the api package from the api-service root folder; tests live in tests/
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
