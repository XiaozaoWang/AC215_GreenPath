# Application reads the configured bundle and optional version catalog; training is separate.
networks:
  default: {}
services:
  api-service:
    build: ./src/api-service
    image: greenpath-api-service
    ports:
      - "127.0.0.1:${API_PORT:-9000}:9000"
    volumes:
      - ./src/api-service:/app
      - ./.artifacts:/artifacts:ro
    environment:
      GCP_PROJECT: ${GCP_PROJECT:-organic-victory-508017-v9} #如果.env没设置则用这里的值
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-bundle}
      MODEL_ARTIFACTS_ROOT: /artifacts
      MODEL_CATALOG_PATH: /artifacts/catalog/serving.json
      MODEL_BUNDLE_DIR: ${MODEL_BUNDLE_DIR:-/app/fixtures/boston-heldout-en-v2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  frontend:
    build:
      context: ./src/frontend-app
      dockerfile: Dockerfile.dev
    image: greenpath-frontend
    entrypoint: ["/bin/bash", "-c", "npm ci && npm run dev"]
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./src/frontend-app:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_BASE_API_URL: http://localhost:${API_PORT:-9000}
    depends_on:
      api-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
volumes:
  frontend_node_modules:
