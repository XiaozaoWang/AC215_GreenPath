# Step 1: application + real saved baseline fixture. Batch training comes later.
networks:
  default:
    name: greenpath-network
services:
  api-service:
    build: ./api-service
    image: greenpath-api-service
    ports:
      - "127.0.0.1:${API_PORT:-9000}:9000"
    volumes:
      - ./api-service:/app
      - ./.artifacts:/artifacts:ro
    environment:
      GCP_PROJECT: ${GCP_PROJECT:-organic-victory-508017-v9}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-bundle}
      MODEL_BUNDLE_DIR: ${MODEL_BUNDLE_DIR:-/app/fixtures/boston-heldout-en-v2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: greenpath-frontend
    entrypoint: ["/bin/bash", "-c", "npm ci && npm run dev"]
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_BASE_API_URL: http://localhost:${API_PORT:-9000}
    depends_on:
      api-service:
        condition: service_healthy
volumes:
  frontend_node_modules:
